<meta name="apple-mobile-web-app-capable" content="yes">

<!-- UI 서체 Pretendard (SIL OFL) — 받지 못하면 기기의 고딕(Apple SD Gothic Neo)으로 보입니다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/*__KOFONT__*/
/* ─────────────────────────────────────────────────────────
   윌리엄 베이츠, 『신적 속성의 조화』 (1674) — 한영 대역 독본
   Design: a Restoration-era London quarto, rebuilt for glass.
   반응형: 아이폰(단칸) · 아이패드/맥(고정 사이드바 + 넓은 지면)
   ───────────────────────────────────────────────────────── */

/* 색 규칙: 흑백 바탕 · 회색 보조 · 포인트 형광 그린/레드 · 링크 밝은 파랑 · 북마크 레드.
   다크가 기본이며(설정 '어둡게'), 밝게·기기 설정도 고를 수 있습니다.
   --rubric·--gilt 는 장식용 회색, --indigo 는 링크 파랑으로 뜻이 바뀌었습니다. */
:root{
  --paper:#FFFFFF;
  --paper-raised:#F4F4F5;
  --paper-sunk:#E9E9EC;
  --ink:#0B0B0C;
  --ink-soft:#55565B;
  --ink-faint:#8B8C92;
  --rule:#E4E4E7;
  --rule-strong:#CFCFD4;
  --rubric:#55565B;
  --rubric-wash:#0b0b0c0f;
  --indigo:#0066FF;
  --indigo-wash:#0b0b0c0d;
  --gilt:#55565B;
  --gilt-wash:#0b0b0c12;
  --shadow:0 1px 2px #0000000d, 0 16px 32px -20px #00000059;
  --sheet-scrim:#0b0b0c52;

  --green:#39FF14;          /* 포인트 1 · 형광펜 1 · 진도 · 선택 · 주요 버튼 */
  --red:#FF2D46;            /* 포인트 2 · 형광펜 2 · 북마크 · 지우기 */
  --on-accent:#0B0B0C;      /* 그린 버튼 위 글자 — 테마와 상관없이 검정 */
  --link:#0066FF;
  --link-wash:#0066ff14;

  /* 저장값 g(예전 초록)·p(예전 분홍)는 그대로 두고 보이는 색만 바꿉니다. y·b 도 그린으로 보입니다 */
  --hlG:rgba(57,255,20,.40);
  --hlP:rgba(255,45,70,.30);
  --hlY:var(--hlG);
  --hlB:var(--hlG);

  --fs:23px;
  --lh-ko:1.95;
  --lh-en:1.72;
  --measure:34rem;

  --serif-en:'Iowan Old Style','Hoefler Text',Palatino,'Palatino Linotype','Book Antiqua',Georgia,serif;
  --serif-ko:'HBMyeongjo','AppleMyungjo','Nanum Myeongjo','Noto Serif KR','Apple SD Gothic Neo',serif;
  --sans-ko:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --ui:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
  --body-ko:var(--serif-ko);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#000000; --paper-raised:#111113; --paper-sunk:#1C1C1F;
    --ink:#F4F4F5; --ink-soft:#A1A1AA; --ink-faint:#6B6B73;
    --rule:#232327; --rule-strong:#3A3A40;
    --rubric:#A1A1AA; --rubric-wash:#ffffff12;
    --indigo:#4D94FF; --indigo-wash:#ffffff10;
    --gilt:#A1A1AA; --gilt-wash:#ffffff14;
    --link:#4D94FF; --link-wash:#4d94ff1f;
    --shadow:0 1px 2px #0008, 0 16px 32px -20px #000;
    --sheet-scrim:#000000b3;
    --hlG:rgba(57,255,20,.30); --hlP:rgba(255,45,70,.40);
    color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#000000; --paper-raised:#111113; --paper-sunk:#1C1C1F;
    --ink:#F4F4F5; --ink-soft:#A1A1AA; --ink-faint:#6B6B73;
    --rule:#232327; --rule-strong:#3A3A40;
    --rubric:#A1A1AA; --rubric-wash:#ffffff12;
    --indigo:#4D94FF; --indigo-wash:#ffffff10;
    --gilt:#A1A1AA; --gilt-wash:#ffffff14;
    --link:#4D94FF; --link-wash:#4d94ff1f;
    --shadow:0 1px 2px #0008, 0 16px 32px -20px #000;
    --sheet-scrim:#000000b3;
    --hlG:rgba(57,255,20,.30); --hlP:rgba(255,45,70,.40);
    color-scheme:dark; }

*{box-sizing:border-box}
html{scroll-padding-top:4rem}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body-ko); font-size:var(--fs);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow-wrap:break-word;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 상단 바 ───────────────────────────────────────────── */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--rule);
}
.bar{
  display:flex; align-items:center; gap:.15rem;
  padding:calc(env(safe-area-inset-top) + .4rem) .5rem .15rem;
}
/* 읽기 진행 — 서문+23장을 구간으로 나눈 간단한 막대 */
.readbar{display:flex;align-items:center;gap:.6rem;padding:0 .7rem .5rem}
.readbar__seg{flex:1;display:flex;gap:2px;height:.4rem;min-width:0}
.pseg{flex:1;background:var(--paper-sunk);border-radius:1.5px;position:relative;overflow:hidden;cursor:pointer}
.pseg__fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--green);transition:width .3s}
.pseg.cur{box-shadow:inset 0 0 0 1px var(--green)}
.pseg:hover{background:var(--indigo-wash)}
.readbar__pct{flex:none;font-family:var(--ui);font-size:.62rem;letter-spacing:.02em;color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar__id{
  flex:1; min-width:0; text-align:center;
  font-family:var(--ui); font-size:.72rem; letter-spacing:.09em;
  color:var(--ink-faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.iconbtn{
  width:2.4rem;height:2.4rem;flex:none;
  display:grid;place-items:center;border-radius:.5rem;
  color:var(--ink-soft);
}
.iconbtn:hover{background:var(--indigo-wash);color:var(--ink)}
.iconbtn svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#btnBm.on{color:var(--red)}
#btnBm.on svg{fill:var(--red);stroke:var(--red)}

/* ── 지면 ─────────────────────────────────────────────── */
main{
  max-width:var(--measure); margin:0 auto;
  padding:2.5rem 1.35rem calc(env(safe-area-inset-bottom) + 6rem);
}
/* 태블릿·데스크톱: 본문이 화면(사이드바 여닫힘 포함)을 채우도록 유동 폭 */
@media (min-width:700px){
  main{ max-width:none; padding:2.8rem clamp(1.6rem,5vw,5.5rem) calc(env(safe-area-inset-bottom) + 6rem); }
}
.opener{margin:1rem 0 3rem}
.opener__num{
  font-family:var(--serif-en); font-size:.8rem; letter-spacing:.32em;
  text-transform:uppercase; color:var(--rubric);
}
.opener__ko{
  font-family:var(--serif-ko); font-weight:700;
  font-size:clamp(1.6rem,5.2vw,2.15rem); line-height:1.4;
  margin:.55rem 0 .3rem; text-wrap:balance;
}
.opener__en{
  font-family:var(--serif-en); font-style:italic;
  font-size:1rem; color:var(--ink-faint); line-height:1.45; text-wrap:balance; margin:0;
}
.opener__rule{display:flex;align-items:center;gap:.6rem;margin-top:1.4rem}
.opener__rule::before,.opener__rule::after{content:"";flex:1;height:1px;background:var(--rule-strong)}
.opener__rule span{color:var(--rubric);font-size:.7rem;letter-spacing:.2em}

/* 옮긴이의 길잡이 */
.gist{
  background:var(--paper-raised); border:1px solid var(--rule);
  border-left:2px solid var(--rubric);
  border-radius:.3rem; padding:1.05rem 1.15rem; margin:0 0 1.9rem;
  box-shadow:var(--shadow);
}
.gist__t{
  font-family:var(--ui); font-size:.66rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rubric); margin-bottom:.55rem;
}
.gist p{margin:0 0 .7rem;font-size:.94rem;line-height:1.8;color:var(--ink-soft);word-break:keep-all}
.gist p:last-child{margin-bottom:0}

/* 논지 — 베이츠 자신의 장 개요 */
.argument{margin:0 0 2.4rem;padding:0 0 0 1rem;border-left:1px solid var(--rule-strong)}
.argument__t{
  font-family:var(--ui); font-size:.66rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-faint); margin-bottom:.5rem;
}
.argument .ko{font-size:.94rem;line-height:1.85;color:var(--ink-soft);word-break:keep-all}
.argument .en{font-family:var(--serif-en);font-style:italic;font-size:.88rem;line-height:1.6;color:var(--ink-faint);margin-top:.7rem}

/* ── 문단 ─────────────────────────────────────────────── */
.para{margin:0 0 1.6rem;position:relative}
/* 한글은 어절 사이가 벌어지므로 양쪽 정렬을 쓰지 않습니다 */
.para__ko{margin:0;line-height:var(--lh-ko);text-align:left;word-break:keep-all}
.para__en{
  display:none; margin:.95rem 0 0;
  font-family:var(--serif-en); font-size:.94em; line-height:var(--lh-en);
  color:var(--ink-soft); text-align:justify;
  padding:.85rem 0 .85rem 1rem; border-left:2px solid var(--rule-strong);
}
.para.is-open .para__en{display:block;animation:unfold .28s ease}
@keyframes unfold{from{opacity:0;transform:translateY(-.3rem)}to{opacity:1;transform:none}}

.para--first .para__ko::first-letter{
  font-family:var(--serif-ko); font-size:2.9em; font-weight:700;
  float:left; line-height:.86; margin:.1em .12em 0 0; color:var(--rubric);
}
.para--point .para__ko{font-weight:600}

/* 북마크 표시 리본 */
.para.is-bm::before{
  content:""; position:absolute; left:-1.15rem; top:.15rem;
  width:.5rem; height:1.15rem; background:var(--red);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);
}
/* 이동 시 잠깐 빛나는 강조 */
.para.flash .para__ko{animation:flash 1.4s ease}
.hl.hlflash{animation:hlflash 1.4s ease}
@keyframes hlflash{0%,100%{box-shadow:none}18%,55%{box-shadow:0 0 0 .3rem var(--gilt-wash)}}
@keyframes flash{0%,100%{background:transparent;box-shadow:none}18%,55%{background:var(--gilt-wash);box-shadow:0 0 0 .45rem var(--gilt-wash);border-radius:2px}}

/* 형광펜 */
.hl{border-radius:.14em;padding:.04em 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer}
.hl--y{background:var(--hlY)}
.hl--g{background:var(--hlG)}
.hl--p{background:var(--hlP)}
.hl--b{background:var(--hlB)}

/* 표시 모드 */
body[data-view="en"] .para__ko,
body[data-view="en"] .argument .ko{display:none}
body[data-view="en"] .para__en{
  display:block;border-left:0;padding:0;color:var(--ink);font-size:1em;margin:0;
}
body[data-view="en"] .argument .en{margin-top:0}
body[data-view="both"] .para__en{display:block}
body[data-view="both"] .para__ko{cursor:default}
body[data-view="both"] .para__ko:hover{background:none;box-shadow:none}
body[data-view="ko"] .para__en{display:none}
body[data-view="ko"] .argument .en{display:none}
body[data-view="ko"] .para.is-open .para__en{display:block}

/* 넓은 화면 — 좌우 병렬 (아이패드 가로 · 맥) */
@media (min-width:1120px){
  body[data-view="both"] .para{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(2rem,4vw,4rem);align-items:start}
  body[data-view="both"] .para__en{margin:0;padding:0 0 0 clamp(2rem,4vw,4rem);border-left:1px solid var(--rule)}
  body[data-view="both"] .opener,
  body[data-view="both"] .gist,
  body[data-view="both"] .argument,
  body[data-view="both"] .navfeet,
  body[data-view="both"] .pending{max-width:var(--measure);margin-left:auto;margin-right:auto}
}

/* ── 주석 표지 ────────────────────────────────────────── */
.mark{
  display:inline; cursor:pointer; font-family:var(--ui);
  font-size:.62em; line-height:0; vertical-align:.42em;
  padding:.12em .34em; margin:0 .06em; border-radius:.2rem;
  font-weight:600; white-space:nowrap; user-select:none; -webkit-user-select:none;
}
.mark--s{color:var(--link);background:var(--link-wash)}
.mark--t{color:var(--ink-soft);background:var(--indigo-wash)}
.mark--o{color:var(--gilt);background:var(--gilt-wash)}
.mark:hover{filter:brightness(.9)}

/* ── 장 이동 ──────────────────────────────────────────── */
.navfeet{display:flex;gap:.7rem;margin-top:3.5rem;padding-top:1.6rem;border-top:1px solid var(--rule)}
.navfeet a{
  flex:1;text-decoration:none;color:inherit;
  border:1px solid var(--rule);border-radius:.4rem;padding:.8rem .9rem;
  background:var(--paper-raised);min-width:0;
}
.navfeet a:hover{border-color:var(--rule-strong)}
.navfeet .dir{font-family:var(--ui);font-size:.62rem;letter-spacing:.14em;color:var(--ink-faint)}
.navfeet .ttl{font-size:.88rem;margin-top:.3rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.navfeet .next{text-align:right}
.navfeet .ghost{visibility:hidden;border:0;background:none}

/* ── 서랍 (목차·형광펜·북마크) ────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:50;background:var(--sheet-scrim);
  opacity:0;pointer-events:none;transition:opacity .25s;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:51;width:min(23rem,86vw);
  background:var(--paper-raised);border-right:1px solid var(--rule);
  transform:translateX(-101%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer__head{padding:calc(env(safe-area-inset-top) + 1.1rem) 1.2rem .9rem;border-bottom:1px solid var(--rule)}
.drawer__head h1{font-size:1.05rem;margin:0;font-family:var(--serif-ko);line-height:1.45}
.drawer__head p{margin:.35rem 0 0;font-family:var(--serif-en);font-style:italic;font-size:.8rem;color:var(--ink-faint)}
.tabs{display:flex;gap:.25rem;padding:.55rem .7rem;border-bottom:1px solid var(--rule)}
.tab{flex:1;padding:.5rem .3rem;border-radius:.4rem;font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);white-space:nowrap}
.tab.on{background:var(--green);color:var(--on-accent);font-weight:700}
.tab .cnt{font-size:.66rem;opacity:.7;margin-left:.2rem}
.panelwrap{flex:1;display:flex;min-height:0}
.panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom) + 2rem)}
.panel[hidden]{display:none}

.toc{padding:.6rem 0 calc(env(safe-area-inset-bottom) + 2rem)}
.toc__part{
  display:flex;align-items:center;gap:.55rem;padding:1.35rem 1.2rem .5rem;
  font-family:var(--ui);font-size:.63rem;letter-spacing:.16em;color:var(--rubric);
}
.toc__part::after{content:"";flex:1;height:1px;background:var(--rule)}
.toc a{
  display:flex;gap:.7rem;align-items:baseline;
  padding:.55rem 1.2rem;text-decoration:none;color:var(--ink-soft);font-size:.88rem;line-height:1.45;
}
.toc a:hover{background:var(--indigo-wash);color:var(--ink)}
.toc a.on{color:var(--ink);background:var(--indigo-wash);box-shadow:inset 3px 0 0 var(--green)}
.toc .rn{font-family:var(--serif-en);font-size:.74rem;color:var(--ink-faint);flex:none;width:2.1rem}
.toc a.on .rn{color:var(--ink)}
.toc .lbl{flex:1}
.toc a.none .lbl{opacity:.45}
.toc .dot{flex:none;width:.34rem;height:.34rem;border-radius:50%;background:var(--green);align-self:center;opacity:0}
.toc a.done .dot{opacity:.9}

/* 형광펜·북마크 목록 */
.li{display:flex;gap:.6rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--rule);align-items:flex-start;cursor:pointer}
.li:hover{background:var(--indigo-wash)}
.li__dot{flex:none;width:.7rem;height:.7rem;border-radius:2px;margin-top:.3rem}
.li__dot.d-y{background:var(--hlY)}.li__dot.d-g{background:var(--hlG)}.li__dot.d-p{background:var(--hlP)}.li__dot.d-b{background:var(--hlB)}
.li__dot.d-bm{background:var(--red);border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);width:.55rem;height:.8rem;margin-top:.28rem}
.li__main{flex:1;min-width:0}
.li__meta{font-family:var(--ui);font-size:.6rem;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:.25rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.li__side{font-size:.58rem;padding:.05rem .32rem;border-radius:.2rem;background:var(--paper-sunk);color:var(--ink-soft)}
.li__txt{font-size:.85rem;line-height:1.55;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.li__x{flex:none;color:var(--ink-faint);width:1.7rem;height:1.7rem;display:grid;place-items:center;border-radius:.35rem;align-self:center}
.li__x:hover{background:var(--rubric-wash);color:var(--red)}
.li__x svg{width:.95rem;height:.95rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.panel__head{font-family:var(--ui);font-size:.62rem;letter-spacing:.13em;color:var(--rubric);padding:1.1rem 1.1rem .35rem;position:sticky;top:0;background:var(--paper-raised)}
.panel__sub{font-family:var(--ui);font-size:.6rem;letter-spacing:.08em;color:var(--ink-faint);padding:.75rem 1.1rem .2rem;word-break:keep-all}
.panel__empty{padding:3rem 1.5rem;color:var(--ink-faint);font-size:.86rem;line-height:1.8;text-align:center;word-break:keep-all}
.panel__empty svg{width:2rem;height:2rem;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5;margin-bottom:.8rem;display:block;margin-left:auto;margin-right:auto}

/* ── 하단/도킹 시트 ───────────────────────────────────── */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:52;
  background:var(--paper-raised);border-top:1px solid var(--rule);
  border-radius:1rem 1rem 0 0;box-shadow:0 -8px 40px -16px #0007;
  transform:translateY(101%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:78vh;display:flex;flex-direction:column;
}
.sheet.on{transform:none}
@media (min-width:760px){
  .sheet{left:auto;right:1.4rem;bottom:1.4rem;width:26rem;border-radius:.7rem;border:1px solid var(--rule-strong);max-height:70vh}
}
.sheet__grip{padding:.6rem 0 .1rem;display:grid;place-items:center}
.sheet__grip i{width:2.4rem;height:.22rem;border-radius:1rem;background:var(--rule-strong)}
.sheet__head{display:flex;align-items:center;gap:.6rem;padding:.5rem 1.15rem .8rem;border-bottom:1px solid var(--rule)}
.sheet__kind{font-family:var(--ui);font-size:.6rem;letter-spacing:.14em;padding:.25rem .5rem;border-radius:.25rem;flex:none}
.sheet__ttl{flex:1;min-width:0;font-size:.95rem;font-weight:600;line-height:1.4}
.sheet__body{overflow-y:auto;padding:1.1rem 1.15rem calc(env(safe-area-inset-bottom) + 1.5rem);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet__body p{margin:0 0 .9rem;font-size:.92rem;line-height:1.85;color:var(--ink);word-break:keep-all}

  return (BOOK[ab] || ab) + ' ' + s.slice(sp + 1);
}
var KIND = {s:{cls:'mark--s',label:'성경'}, t:{cls:'mark--t',label:'주해'}, o:{cls:'mark--o',label:'원어'}, b:{cls:'mark--t',label:'배경'}};

/* 본문 속 {{id}} 표지를 실제 마커 노드로 바꾸어 채웁니다 */
function fill(node, text, notes){
  var parts = String(text).split(/\{\{([a-z0-9_]+)\}\}/);
  for(var i = 0; i < parts.length; i++){
    if(i % 2 === 0){ if(parts[i]) node.appendChild(txt(parts[i])); continue; }
    var n = notes && notes[parts[i]];
    if(!n) continue;
    var k = KIND[n.k] || KIND.t;
    node.appendChild(el('span', {
      cls:'mark ' + k.cls, 'data-note':parts[i], role:'button', tabindex:'0', text:(n.m || '주')
    }));
  }
  return node;
}
function plain(t){ return String(t).replace(/\{\{[a-z0-9_]+\}\}/g, '').trim(); }

/* ── 재번역 형광펜 이전 ───────────────────────────────────
   서문·I–VI장 본문을 새로 번역하면서, 예전 번역의 글자 위치로 저장된 형광펜·노트를
   새 번역의 같은 대목으로 옮깁니다. HLM.map = 백업에 있던 형광펜마다 고른 새 위치
   (tools/retrans/hlmap.py), 표에 없는 것은 문단 안 비율로 옮깁니다.
   옮긴 항목과 새로 만든 항목에는 tv(본문 판)를 붙여 두 번 옮기지 않습니다.
   다른 기기·서버에서 들어오는 예전 항목도 합치기 전에 같은 방식으로 옮깁니다. */
var HLM = DATA.hlmig || {v:0, old:{}, map:{}};
/* 화면에 보이는 한국어 문단 글자열 — 주석 표지는 그 약칭 글자로 (fill과 같은 규칙) */
function koText(ch, i){
  var c = CH[ch], notes = (c && c.notes) || {};
  return String((c && c.ko && c.ko[i]) || '').replace(/\{\{([a-z0-9_]+)\}\}/g, function(_, id){
    var n = notes[id]; return n ? (n.m || '주') : '';
  });
}
/* 새로 만드는 항목의 본문 판 — 옮김 대상인 장에서만 붙입니다 (아직 옮기지 않은 장은 예전 번역 기준이므로) */
function tvFor(ch){ return HLM.old[ch] ? HLM.v : 0; }
function hlmNeed(ch, side, tv){ return side === 'ko' && !!HLM.old[ch] && (tv || 0) < HLM.v; }
function hlmSpan(ch, i, a, b){
  var o = HLM.old[ch][i] || 1, n = koText(ch, i).length;
  var na = Math.min(Math.round(a * n / o), n), nb = Math.min(Math.max(Math.round(b * n / o), na + 1), n);
  return [i, Math.min(na, Math.max(nb - 1, 0)), nb];
}
function migHl(ch, h){
  if(!h || !hlmNeed(ch, h.side, h.tv)) return h;
  var s = HLM.map[h.id] || hlmSpan(ch, h.i, h.a, h.b);
  var t = koText(ch, s[0]);
  return {id:hlId(ch, 'ko', s[0], s[1], s[2]), i:s[0], side:'ko', a:s[1], b:s[2], c:h.c,
          t:t.slice(s[1], s[2]), ts:h.ts, tv:HLM.v};
}
function migMemo(ch, m){
  if(!m || !m.parts || !hlmNeed(ch, m.side, m.tv)) return m;
  var parts = m.parts.map(function(pt){ var s = hlmSpan(ch, pt.i, pt.a, pt.b); return {i:s[0], a:s[1], b:s[2]}; });
  var o = {}; for(var k in m) o[k] = m[k];
  o.parts = parts;
  o.t = parts.map(function(pt){ return koText(ch, pt.i).slice(pt.a, pt.b); }).join(' … ');
  o.tv = HLM.v;
  return o;
}
function migBm(b){
  if(!b || !HLM.old[b.ch] || (b.tv || 0) >= HLM.v) return b;
  var c = CH[b.ch], o = {}; for(var k in b) o[k] = b[k];
  o.t = plain((c && c.ko && c.ko[b.i]) || '').slice(0, 70); o.tv = HLM.v;
  return o;
}
/* 형광펜·노트·북마크 묶음 전체를 옮깁니다 (같은 id가 겹치면 하나만) */
function migAll(hl, memo, bm){
  if(hl) for(var ch in hl){
    if(!HLM.old[ch] || !hl[ch]) continue;
    var seen = {};
    hl[ch] = hl[ch].map(function(h){ return migHl(ch, h); })
      .filter(function(h){ if(!h || seen[h.id]) return false; seen[h.id] = 1; return true; });
  }
  if(memo) for(var mc in memo){
    if(HLM.old[mc] && memo[mc]) memo[mc] = memo[mc].map(function(m){ return migMemo(mc, m); });
  }
  return Array.isArray(bm) ? bm.map(migBm) : bm;
}
(function(){
  if(!HLM.v) return;
  var before = JSON.stringify([S.hl, S.memo, S.bm]);
  S.bm = migAll(S.hl, S.memo, S.bm);
  if(JSON.stringify([S.hl, S.memo, S.bm]) === before) return;
  LS.set('hb.hl', JSON.stringify(S.hl));
  LS.set('hb.memo', JSON.stringify(S.memo));
  LS.set('hb.bm', JSON.stringify(S.bm));
})();

/* 지운 항목을 기록해 둡니다. 이게 없으면 다른 기기와 합칠 때 지운 것이 되살아납니다 */
function tombHl(id){ S.del.h[id] = Date.now(); saveDel(); }
function tombBm(ch, i){ S.del.b[ch + '|' + i] = Date.now(); saveDel(); }

function hlId(ch, side, i, a, b){ return ch + '|' + side + '|' + i + '|' + a + '|' + b; }

/* 컨테이너 텍스트 기준 시작~끝 문자 오프셋 */
function offsetOf(container, node, off){
  var r = document.createRange();
  r.selectNodeContents(container);
  try { r.setEnd(node, off); } catch(e){ return 0; }
  return r.toString().length;
}
/* [a,b) 구간을 span.hl 로 감쌉니다 (마커 텍스트는 건너뜀).
   kind 가 'memo' 면 노트 표시용 span.memo 로 감쌉니다. 노트를 먼저 감싸고 형광펜을 그 안에 칠합니다. */
function wrapRange(container, a, b, id, color, kind){
  var memo = kind === 'memo';
  var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
  var acc = 0, node, jobs = [];
  while((node = walker.nextNode())){
    var len = node.nodeValue.length, ns = acc, ne = acc + len; acc = ne;
    if(ne <= a || ns >= b) continue;
    if(node.parentNode && node.parentNode.closest && node.parentNode.closest(memo ? '.mark, .memo' : '.mark, .hl')) continue;
    jobs.push([node, Math.max(a, ns) - ns, Math.min(b, ne) - ns]);
  }
  jobs.forEach(function(j){
    var tn = j[0], s = j[1], e = j[2];
    var mid = (s > 0) ? tn.splitText(s) : tn;
    if(e - s < mid.nodeValue.length) mid.splitText(e - s);
    var span = memo ? el('span', {cls:'memo', 'data-memo':id}) : el('span', {cls:'hl hl--' + color, 'data-hl':id});
    mid.parentNode.insertBefore(span, mid);
    span.appendChild(mid);
  });
}
function applyHls(page){
  var arr = S.hl[S.ch]; if(!arr) return;
  arr.slice().sort(function(x,y){ return (x.a-y.a) || (x.b-y.b); }).forEach(function(h){

    var c = box.querySelector(h.side === 'ko' ? '.para__ko' : '.para__en'); if(!c) return;
    wrapRange(c, h.a, h.b, h.id, h.c);
  });
}
/* 주석 팝업 안 형광펜 — 저장 키가 장 하나에 매이지 않으므로 별도 함수로 둡니다.
   같은 번호(예: s1)의 주석이 장마다 따로 있을 수 있어, 키에 장 id를 함께 넣습니다. */

/* ── 노트 ─────────────────────────────────────────────────
   본문 대목에 붙이는 메모입니다. 형광펜처럼 장 키(S.memo['6'])와 글자 위치(a, b)로 묶이고,

   {id, side, parts:[{i,a,b}], t:고른 글자, body:메모, ts:만든 시각, u:고친 시각} */
function saveMemo(){

  LS.set('hb.memo', JSON.stringify(S.memo));
  updCounts();
  if(window.SYNC) SYNC.schedule();
}
function tombMemo(id){ S.del.m[id] = Date.now(); saveDel(); }
function memoDead(m){ var t = S.del.m[m.id]; return !!t && t >= (m.u || 0); }
function findMemo(id){
  var arr = S.memo[String(id).split('|')[0]] || [];
  for(var j = 0; j < arr.length; j++){ if(arr[j].id === id) return arr[j]; }

}
function memoDraft(ch, side, parts){
  return {ch:ch, side:side,
    parts:parts.map(function(pt){ return {i:pt.i, a:pt.a, b:pt.b}; }),
    t:parts.map(function(pt){ return pt.text; }).join(' … ')};
}
function applyMemos(page){
  var arr = S.memo[S.ch]; if(!arr) return;
  arr.forEach(function(m){
    m.parts.forEach(function(pt){
      var box = page.querySelector('.para[data-i="' + pt.i + '"]'); if(!box) return;
      var c = box.querySelector(m.side === 'ko' ? '.para__ko' : '.para__en'); if(!c) return;
      wrapRange(c, pt.a, pt.b, m.id, null, 'memo');
    });
    var pieces = page.querySelectorAll('.memo[data-memo="' + m.id + '"]');
    if(pieces.length) pieces[pieces.length - 1].classList.add('memo--end');
  });
}
/* 주해 팝업 안 노트 — 키는 주해 형광펜과 같은 'n:<장>:<주석id>', 블록은 .nblk 번호 */
function applyNoteMemos(ownerCh, noteId, body){
  var arr = S.memo[noteHlKey(ownerCh, noteId)]; if(!arr) return;
  arr.forEach(function(m){
    m.parts.forEach(function(pt){
      var c = body.querySelector('.nblk[data-nb="' + pt.i + '"]');
      if(c) wrapRange(c, pt.a, pt.b, m.id, null, 'memo');
    });
    var pieces = body.querySelectorAll('.memo[data-memo="' + m.id + '"]');
    if(pieces.length) pieces[pieces.length - 1].classList.add('memo--end');
  });
}
/* 주해 노트를 닫으면 그 주해 팝업으로 돌아갑니다 */
function backToNote(key){
  key = String(key);
  if(key.indexOf('n:') !== 0) return;
  var p = key.split(':'), owner = p[1], nid = p.slice(2).join(':');
  setTimeout(function(){
    if(S.ch === owner && !document.getElementById('sheet').classList.contains('on')) showNote(nid);
  }, 0);
}
/* 노트 시트 제목: 본문 노트는 장 이름, 주해 노트는 그 주해 제목 */
function memoTitle(key){
  key = String(key);
  if(key.indexOf('n:') !== 0) return chLabel(key);
  var p = key.split(':'), n = (CH[p[1]] && CH[p[1]].notes || {})[p.slice(2).join(':')] || {};
  return '주해 · ' + (n.title || n.m || '주해');
}
/* 칠한 형광펜을 눌러 노트 버튼을 누르면: 그 자리에 걸친 노트가 있으면 열고, 없으면 새로 씁니다 */
function memoForHl(ch, hlid){
  var h = null;
  (S.hl[ch] || []).forEach(function(x){ if(x.id === hlid) h = x; });
  if(!h) return;
  var hit = null;
  (S.memo[ch] || []).forEach(function(m){
    if(hit || m.side !== h.side) return;
    if(m.parts.some(function(pt){ return pt.i === h.i && pt.a < h.b && h.a < pt.b; })) hit = m;
  });
  if(hit) openMemoSheet(hit, false);
  else openMemoSheet(memoDraft(ch, h.side, [{i:h.i, a:h.a, b:h.b, text:h.t}]), true);
}
function fmtDate(t){
  var d = new Date(t), p2 = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '. ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function openMemoSheet(m, isNew){
  var ch = isNew ? m.ch : m.id.split('|')[0];
  var body = openSheet('노트', memoTitle(ch), 'm');
  body.appendChild(el('div', {cls:'quote'}, [el('p', {cls:'k', text:m.t})]));
  var ta = el('textarea', {cls:'memota', placeholder:'이 대목에 대한 생각을 적어 두세요'});
  ta.value = m.body || '';
  body.appendChild(ta);
  var sv = el('button', {cls:'bkbtn bkbtn--go', text:'저장'});
  sv.onclick = function(){ closeSheet(); };          /* 닫을 때 저장됩니다 */
  var btns = [sv];
  if(!isNew){
    var rm = el('button', {cls:'bkbtn bkbtn--danger', text:'노트 지우기'});
    rm.onclick = function(){
      if(!confirm('이 노트를 지울까요?')) return;
      S.memoOpen = null;
      removeMemoEntry(m.id);
      closeSheet(); refreshMemoView(ch); backToNote(ch);
      toast('노트를 지웠어요');
    };
    btns.push(rm);
  }
  body.appendChild(el('div', {cls:'bkrow'}, btns));
  if(!isNew) body.appendChild(el('p', {cls:'memometa',
    text:'적은 때 ' + fmtDate(m.ts) + (m.u && m.u !== m.ts ? ' · 고친 때 ' + fmtDate(m.u) : '')}));
  S.memoOpen = {m:m, isNew:isNew, ch:ch, ta:ta};
  if(isNew) setTimeout(function(){ try{ ta.focus(); }catch(e){} }, 360);
}
/* 열린 노트를 저장합니다. 바뀐 게 있으면 true */
function commitMemo(o){
  var text = o.ta.value.replace(/\s+$/, '');
  if(o.isNew){
    if(!text.trim()) return false;                   /* 빈 노트는 만들지 않습니다 */
    var now = Date.now();
    var m = {id:o.ch + '|m|' + now.toString(36) + Math.random().toString(36).slice(2, 6),
             side:o.m.side, parts:o.m.parts, t:o.m.t, body:text, ts:now, u:now, tv:tvFor(o.ch)};
    (S.memo[o.ch] || (S.memo[o.ch] = [])).push(m);
  } else {
    if(text === o.m.body) return false;
    if(!text.trim()){ removeMemoEntry(o.m.id); return true; }   /* 내용을 다 지우면 노트도 지웁니다 */
    o.m.body = text; o.m.u = Date.now();
  }
  saveMemo();
  return true;
}
function flushMemo(closing){
  var o = S.memoOpen; if(!o) return;
  S.memoOpen = null;
  if(commitMemo(o)){
    toast('노트를 저장했어요');
    setTimeout(function(){ refreshMemoView(o.ch); }, 0);   /* 시트를 닫는 도중에 다시 그리지 않도록 미룹니다 */
  }
  if(closing) backToNote(o.ch);
}
function removeMemoEntry(id){
  var ch = id.split('|')[0];
  S.memo[ch] = (S.memo[ch] || []).filter(function(m){ return m.id !== id; });
  tombMemo(id); saveMemo();
}
function refreshMemoView(ch){
  if(ch === S.ch) rerender();
  if(S.tab === 'memo') buildMemoPanel();
}
function gotoMemo(ch, id){
  closeDrawerIfMobile();
  var m = findMemo(id); if(!m) return;
  var inNote = id.indexOf('n:') === 0;             /* 주해 노트는 본문 문단으로 스크롤하지 않습니다 */
  if(S.ch === ch){ if(!inNote) scrollToPara(m.parts[0].i, true); openMemoSheet(m, false); }
  else { if(!inNote) S.jump = {ch:ch, i:m.parts[0].i, flash:true}; S.jumpMemo = {ch:ch, id:id}; location.hash = ch; }
}

/* 선택 감지 → 툴바 */
function paraSideOf(node){
  var e = node.nodeType === 1 ? node : node.parentNode;
  return e && e.closest ? e.closest('.para__ko, .para__en') : null;
}
/* 열려 있는 주석 팝업 안에서 고른 대목 (원어 인용·한글 사역·해설 문단) */
function noteBlockOf(node){
  var e = node.nodeType === 1 ? node : node.parentNode;
  return e && e.closest ? e.closest('.nblk') : null;
}
/* 선택 범위가 걸치는 블록들을 각각 (블록, 그 안에서의 시작~끝 오프셋)으로 잘라 냅니다.
   두 문단 이상 걸쳐 선택해도 문단마다 형광펜 한 조각씩 만들 수 있게 합니다. */
function partsInRange(range, blocks){
  var out = [];
  for(var j = 0; j < blocks.length; j++){
    var blk = blocks[j];
    if(!range.intersectsNode(blk)) continue;
    var full = blk.textContent;
    var a = blk.contains(range.startContainer) ? offsetOf(blk, range.startContainer, range.startOffset) : 0;
    var b = blk.contains(range.endContainer) ? offsetOf(blk, range.endContainer, range.endOffset) : full.length;
    if(b < a){ var t = a; a = b; b = t; }
    /* 앞뒤 공백만 걸린 조각은 건너뜁니다 */
    while(a < b && /\s/.test(full[a])) a++;
    while(b > a && /\s/.test(full[b-1])) b--;
    if(b - a < 1) continue;
    out.push({blk:blk, a:a, b:b, text:full.slice(a, b)});
  }
  return out;
}
function onSelDone(){
  setTimeout(function(){
    var sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.rangeCount){
      if(S.pending && S.pending.mode === 'add') hideTool();
      return;
    }
    var range = sel.getRangeAt(0);

    /* 열린 주석 안에서 고른 경우를 먼저 봅니다 (여러 문단 가능) */
    var sheetOn = document.getElementById('sheet').classList.contains('on');
    if(sheetOn && S.noteId && noteBlockOf(range.startContainer)){
      var blocks = Array.prototype.slice.call(document.getElementById('sheetBody').querySelectorAll('.nblk'));
      var nparts = partsInRange(range, blocks).map(function(pp){
        return {i:+pp.blk.dataset.nb, a:pp.a, b:pp.b, text:pp.text};
      });
      if(!nparts.length){ hideTool(); return; }
      S.pending = {mode:'add', ch:noteHlKey(S.noteCh, S.noteId), side:'nb', parts:nparts};
      document.getElementById('hltool').dataset.mode = 'add';
      document.getElementById('hltool').dataset.memo = 'on';
      showToolAt(range.getBoundingClientRect());
      return;
    }

    /* 본문 (여러 문단 가능) */
    var startSide = paraSideOf(range.startContainer);
    if(!startSide){ hideTool(); return; }
    var side = startSide.classList.contains('para__ko') ? 'ko' : 'en';
    var boxes = Array.prototype.slice.call(document.querySelectorAll('#page .para__' + side));
    var parts = partsInRange(range, boxes).map(function(pp){
      var box = pp.blk.closest('.para');
      return {i:+box.dataset.i, a:pp.a, b:pp.b, text:pp.text};
    });
    if(!parts.length){ hideTool(); return; }
    S.pending = {mode:'add', ch:S.ch, side:side, parts:parts};
    document.getElementById('hltool').dataset.mode = 'add';
    document.getElementById('hltool').dataset.memo = 'on';
    showToolAt(range.getBoundingClientRect());
  }, 8);
}
function isTouchUI(){
  return !!(window.matchMedia && (
    window.matchMedia('(max-width:699px)').matches ||
    window.matchMedia('(hover:none) and (pointer:coarse)').matches
  ));
}
function showToolAt(rect){
  var t = document.getElementById('hltool');
  t.classList.add('on');
  /* 터치 기기(폰·아이패드 등)에서는 아래에 고정되므로 위치를 계산하지 않습니다.
     화면 폭이 아니라 '호버가 없고 포인터가 뭉툭한지'로 판정해야, 아이패드처럼
     넓은 화면에서도 iOS 자체 선택 메뉴(복사하기 등)와 겹치지 않습니다. */
  if(isTouchUI()){
    t.style.left = ''; t.style.top = '';
    return;
  }
  var tw = t.offsetWidth, th = t.offsetHeight;
  var x = rect.left + rect.width / 2 - tw / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  var y = rect.top - th - 10;
  if(y < 8) y = rect.bottom + 10;
  y = Math.min(y, window.innerHeight - th - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTool(){
  document.getElementById('hltool').classList.remove('on');
  if(S.pending && S.pending.mode === 'add') S.pending = null;
}

/* ── 북마크 ───────────────────────────────────────────── */
function saveBm(){ LS.set('hb.bm', JSON.stringify(S.bm)); updCounts(); if(window.SYNC) SYNC.schedule(); }
function nearestPara(){
  var barEl = document.querySelector('.bar');
  var top = (barEl ? barEl.offsetHeight : 0) + 14;
  var boxes = document.querySelectorAll('.para[data-i]');
  var best = null;
  for(var j = 0; j < boxes.length; j++){
    var r = boxes[j].getBoundingClientRect();
    if(r.top >= top){ best = boxes[j]; break; }
    if(r.bottom > top) best = boxes[j];
  }
  if(!best && boxes.length) best = boxes[boxes.length - 1];
  return best ? +best.dataset.i : null;
}
function toggleBm(){
  if(!S.ch || S.ch === 'cover'){ toast('먼저 본문을 여세요'); return; }
  var i = nearestPara(); if(i == null){ toast('북마크할 문단이 없어요'); return; }
  var ix = -1;
  for(var j = 0; j < S.bm.length; j++){ if(S.bm[j].ch === S.ch && S.bm[j].i === i){ ix = j; break; } }
  if(ix >= 0){ S.bm.splice(ix, 1); tombBm(S.ch, i); saveBm(); toast('북마크를 해제했어요'); }
  else {
    var c = CH[S.ch];
    var snip = plain((c.ko && c.ko[i]) || c.paras[i] || '');
    S.bm.push({ch:S.ch, i:i, t:snip.slice(0, 70), ts:Date.now(), tv:tvFor(S.ch)});
    saveBm(); toast('이 자리를 북마크했어요');
  }
  updBmBtn(); markBmParas();
  if(S.tab === 'bm') buildBmPanel();
}
function removeBm(ch, i){
  S.bm = S.bm.filter(function(b){ return !(b.ch === ch && b.i === i); });
  tombBm(ch, i); saveBm(); markBmParas(); updBmBtn();
}
function markBmParas(){
  document.querySelectorAll('.para.is-bm').forEach(function(b){ b.classList.remove('is-bm'); });
  S.bm.forEach(function(b){
    if(b.ch === S.ch){
      var box = document.querySelector('.para[data-i="' + b.i + '"]');
      if(box) box.classList.add('is-bm');
    }
  });
}
function updBmBtn(){
  var btn = document.getElementById('btnBm'); if(!btn) return;
  var on = false;
  if(S.ch && S.ch !== 'cover'){
    var i = nearestPara();
    on = S.bm.some(function(b){ return b.ch === S.ch && b.i === i; });
  }
  btn.classList.toggle('on', on);
}

/* ── 백업 (기기 간 이동) — 형광펜·북마크·읽은 표시를 파일로 주고받습니다 ── */
function exportBackup(){
  var data = JSON.stringify(snapshot());
  var name = 'bates-harmony-backup.json';
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({filename:name, data:data}).then(function(){
      toast('백업 파일을 저장했어요');
    }, function(err){
      if(!err || err.code !== 'declined') toast('저장하지 못했어요');
    });

  }
}
function importBackup(){ var inp = document.getElementById('fileImport'); inp.value = ''; inp.click(); }
/* 지금 기록 전체를 하나로 묶습니다 (백업 파일과 동기화가 같은 형식을 씁니다) */
function snapshot(){
  /* memo 는 새로 더한 칸입니다. 예전 앱은 이 칸을 모른 채 무시합니다 */
  return {app:'hb', v:2, hl:S.hl, bm:S.bm, read:S.read, del:S.del, memo:S.memo};
}
/* 다른 기기(또는 백업 파일)의 기록을 지금 기록과 합칩니다.
   덮어쓰지 않고 합집합을 취하되, 어느 한쪽에서 지운 것은 지운 상태를 지킵니다. */
function applyData(d){
  var addH = 0, addB = 0, addM = 0;
  if(!S.del) S.del = {h:{}, b:{}, m:{}};

  /* 삭제 기록부터 합칩니다 */
  if(d.del){
    ['h','b','m'].forEach(function(kind){
      if(!S.del[kind]) S.del[kind] = {};
      var src = d.del[kind] || {};
      for(var k in src){
        if(!S.del[kind][k] || S.del[kind][k] < src[k]) S.del[kind][k] = src[k];
      }
    });
  }

  /* 예전 본문 위치로 들어온 항목은 합치기 전에 새 번역 위치로 옮깁니다 (재번역 형광펜 이전).
     지운 기록은 옮기기 전 id와 옮긴 뒤 id를 모두 봅니다 */
  if(d.hl) for(var ch in d.hl){
    var arr = S.hl[ch] || (S.hl[ch] = []);
    (d.hl[ch] || []).forEach(function(h0){
      if(!h0 || S.del.h[h0.id]) return;
      var h = migHl(ch, h0);
      if(S.del.h[h.id]) return;                                   /* 지운 형광펜은 되살리지 않습니다 */
      if(!arr.some(function(x){ return x.id === h.id; })){ arr.push(h); addH++; }
    });
  }
  if(Array.isArray(d.bm)) d.bm.map(migBm).forEach(function(b){
    if(S.del.b[b.ch + '|' + b.i]) return;                         /* 지운 북마크도 마찬가지 */
    if(!S.bm.some(function(x){ return x.ch === b.ch && x.i === b.i; })){ S.bm.push(b); addB++; }
  });

  /* 이쪽에서 지운 것이 저쪽 기록에 남아 있으면 여기서도 정리합니다 */
  for(var c2 in S.hl){
    S.hl[c2] = (S.hl[c2] || []).filter(function(h){ return !S.del.h[h.id]; });
  }
  S.bm = S.bm.filter(function(b){ return !S.del.b[b.ch + '|' + b.i]; });

  if(d.read) for(var c in d.read){ if(d.read[c]) S.read[c] = 1; }

  /* 노트: 없는 것은 더하고, 같은 노트면 더 나중에 고친 쪽 내용을 씁니다.
     지운 기록보다 나중에 고친 노트는 살립니다 */
  if(d.memo) for(var mc in d.memo){
    var marr = S.memo[mc] || (S.memo[mc] = []);
    (d.memo[mc] || []).forEach(function(m0){
      var m = migMemo(mc, m0);
      if(!m || !m.id || !m.parts || memoDead(m)) return;
      var cur = null;
      for(var j = 0; j < marr.length; j++){ if(marr[j].id === m.id){ cur = marr[j]; break; } }
      if(!cur){ marr.push(m); addM++; }
      else if((m.u || 0) > (cur.u || 0)){ cur.body = m.body; cur.u = m.u; }
    });
  }
  for(var mc2 in S.memo){ S.memo[mc2] = (S.memo[mc2] || []).filter(function(m){ return !memoDead(m); }); }

  saveDel(); saveHl(); saveBm(); saveMemo(); LS.set('hb.read', JSON.stringify(S.read));
  return {h:addH, b:addB, m:addM};
}
/* 화면을 합친 결과로 새로 그립니다 */
function refreshAfterMerge(){
  buildToc(); if(S.ch && S.ch !== 'cover') rerender();
  if(S.tab === 'hl') buildHlPanel();
  if(S.tab === 'bm') buildBmPanel();
  if(S.tab === 'memo') buildMemoPanel();
  updReadbar(0);
}
function mergeBackup(d){
  if(!d || d.app !== 'hb'){ toast('알맞은 백업 파일이 아니에요'); return; }
  var n = applyData(d);
  refreshAfterMerge();
  toast('불러왔어요 · 형광펜 ' + n.h + '개 · 노트 ' + n.m + '개 · 북마크 ' + n.b + '개 추가');
  SYNC.schedule();
}

/* ── 기기 간 자동 동기화 ──────────────────────────────────
   같은 '동기화 코드'를 가진 기기끼리 형광펜·북마크·진도를 자동으로 맞춥니다.
   흐름은 늘 같습니다: 내려받기 → 합치기 → 올리기.
   덮어쓰기가 아니라 합치기이므로 두 기기를 동시에 써도 기록이 사라지지 않습니다. */
var SYNC = (function(){
  var DEFAULT_URL = 'https://bates-sync.saltshine.workers.dev';
  var cfg = LS.json('hb.sync', null);      /* {u: 서버주소, k: 코드} */
  var timer = null, running = false, again = false;

  function on(){ return !!(cfg && cfg.u && cfg.k); }
  function endpoint(){ return cfg.u.replace(/\/+$/, '') + '/d/' + encodeURIComponent(cfg.k); }

  function setStatus(msg){
    var e = document.getElementById('syncMsg');
    if(e) e.textContent = msg || '';
  }
  function stamp(t){ LS.set('hb.syncat', t); }
  function lastText(){
    var t = +(LS.get('hb.syncat') || 0);
    if(!t) return '아직 동기화한 적 없음';
    var d = new Date(t), p2 = function(n){ return (n < 10 ? '0' : '') + n; };
    return '마지막 동기화 ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  /* 동기 대상 상태를 순서와 무관한 지문 문자열로 만듭니다.
     이게 서버 것과 같으면 올릴 필요가 없으므로 쓰기를 생략합니다 (KV 하루 쓰기 한도 절약). */
  function canon(o){
    o = o || {};
    var hl = o.hl || {};
    var hp = Object.keys(hl).sort().map(function(k){
      var arr = (hl[k] || []).slice().sort(function(a,b){ return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
      return k + ':' + arr.map(function(h){ return h.id + '@' + h.c; }).join(',');
    }).join(';');
    var bm = (o.bm || []).slice().sort(function(a,b){
      var ka = a.ch + '|' + a.i, kb = b.ch + '|' + b.i; return ka < kb ? -1 : ka > kb ? 1 : 0;
    }).map(function(b){ return b.ch + '|' + b.i; }).join(',');
    var rd = Object.keys(o.read || {}).filter(function(k){ return o.read[k]; }).sort().join(',');
    var del = o.del || {h:{}, b:{}};
    var dh = Object.keys(del.h || {}).sort().join(',');
    var db = Object.keys(del.b || {}).sort().join(',');
    var memo = o.memo || {};
    var mp = Object.keys(memo).sort().map(function(k){
      var arr = (memo[k] || []).slice().sort(function(a,b){ return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
      return k + ':' + arr.map(function(m){ return m.id + '@' + (m.u || 0); }).join(',');
    }).join(';');
    var dm = Object.keys(del.m || {}).sort().join(',');
    return hp + '||' + bm + '||' + rd + '||' + dh + '||' + db + '||' + mp + '||' + dm;
  }
  var pushedSig = null;   /* 마지막으로 서버와 맞춘 지문 */
  function dirty(){ return canon(snapshot()) !== pushedSig; }

  /* 내려받기 → 합치기 → (다를 때만) 올리기 */
  function run(quiet){
    if(!on()) return Promise.resolve(false);
    if(running){ again = true; return Promise.resolve(false); }
    running = true;
    if(!quiet) setStatus('동기화 중…');
    return fetch(endpoint(), {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('내려받기 실패 (' + r.status + ')');
        return r.json();
      })
      .then(function(remote){
        var n = {h:0, b:0, m:0};
        var remoteOk = remote && remote.app === 'hb';
        if(remoteOk) n = applyData(remote);
        var localSig = canon(snapshot());
        var remoteSig = canon(remoteOk ? remote : {});
        if(localSig === remoteSig){          /* 서버와 이미 같음 → 쓰기 생략 */
          pushedSig = localSig;
          return {n:n, pushed:false};
        }
        return fetch(endpoint(), {
          method:'PUT',
          headers:{'Content-Type':'text/plain;charset=UTF-8'},   /* 프리플라이트 없이 나갑니다 */
          body: JSON.stringify(snapshot())
        }).then(function(r){
          if(!r.ok) throw new Error('올리기 실패 (' + r.status + ')');
          pushedSig = localSig;
          return {n:n, pushed:true};
        });
      })
      .then(function(res){
        stamp(Date.now());
        if(res.n.h || res.n.b || res.n.m){
          refreshAfterMerge();
          if(!quiet) toast('동기화 완료 · 형광펜 ' + res.n.h + '개 · 노트 ' + (res.n.m || 0) + '개 · 북마크 ' + res.n.b + '개 받음');
        } else if(!quiet){
          toast(res.pushed ? '동기화 완료 · 이 기기 기록을 올렸어요' : '동기화 완료 · 이미 최신입니다');
        }
        setStatus(lastText());
        return true;
      })
      .catch(function(e){
        setStatus('동기화 실패 · ' + e.message);
        if(!quiet) toast('동기화하지 못했어요 · ' + e.message);
        return false;
      })
      .then(function(ok){
        running = false;
        if(again){ again = false; schedule(); }
        return ok;
      });
  }

  /* 기록이 바뀌면 잠시 모았다가 한 번에 올립니다 (연속 편집을 한 번의 쓰기로 묶습니다) */
  function schedule(){
    if(!on()) return;
    clearTimeout(timer);
    timer = setTimeout(function(){ run(true); }, 4000);
  }

  /* 헷갈리는 글자(I,O,0,1,L)를 뺀 32자 알파벳 · 16자리 = 충분히 안전하면서 손으로 칠 수 있습니다 */
  function randomCode(){
    var a = new Uint8Array(16), out = '';
    (window.crypto || window.msCrypto).getRandomValues(a);
    var abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    for(var i = 0; i < a.length; i++) out += abc[a[i] % abc.length];
    return out;
  }
  /* 보기 좋게 네 자씩 끊어 보여 줍니다 */
  function pretty(k){ return (k || '').replace(/(.{4})(?=.)/g, '$1-'); }
  /* 입력값에서 구분 기호를 걷어냅니다 */
  function normalize(k){ return (k || '').replace(/[^A-Za-z0-9_]/g, ''); }
  function config(){ return cfg; }
  function save(u, k){
    cfg = (u && k) ? {u:u, k:k} : null;
    if(cfg) LS.set('hb.sync', JSON.stringify(cfg));
    else LS.set('hb.sync', '');
  }
  function pairLink(){
    if(!on()) return '';
    return location.origin + location.pathname + '#sync=' + encodeURIComponent(cfg.u) + '~' + encodeURIComponent(cfg.k);
  }
  /* 짝짓기 링크로 들어오면 설정을 받아 저장합니다 */
  function adoptFromHash(){
    var h = location.hash || '';
    if(h.indexOf('#sync=') !== 0) return false;
    var raw = decodeURIComponent(h.slice(6));
    var cut = raw.indexOf('~');
    if(cut < 0) return false;
    save(decodeURIComponent(raw.slice(0, cut)), decodeURIComponent(raw.slice(cut + 1)));
    if(history.replaceState) history.replaceState(null, '', location.pathname);
    else location.hash = '';
    return true;
  }

  return {on:on, run:run, schedule:schedule, dirty:dirty, randomCode:randomCode, defaultUrl:function(){ return DEFAULT_URL; },
          pretty:pretty, normalize:normalize,
          config:config, save:save, pairLink:pairLink,
          adoptFromHash:adoptFromHash, lastText:lastText, setStatus:setStatus};
})();

/* ── 목록 패널 ────────────────────────────────────────── */
var CLABEL = {g:'그린', p:'레드', y:'그린', b:'그린'};   /* 예전 노랑·파랑 기록도 그린으로 보입니다 */
function chLabel(ch){
  var c = CH[ch]; if(!c) return '';
  return (c.roman ? c.roman.replace('.', '') + '. ' : '') + (c.title_ko || c.title);
}
function emptyPanel(list, icon, msg){
  list.appendChild(el('div', {cls:'panel__empty'}, [ svgIcon(icon), txt(msg) ]));
}
function liItem(opts){
  var li = el('div', {cls:'li', 'data-ch':opts.ch, 'data-i':opts.i});
  if(opts.hlid) li.setAttribute('data-hlid', opts.hlid);

  li.setAttribute('data-kind', opts.kind);
  if(opts.note){ li.setAttribute('data-note', opts.note); li.setAttribute('data-ownerch', opts.ownerCh); }
  var meta = el('div', {cls:'li__meta'}, [ el('span', {text:opts.meta}) ]);
  if(opts.side) meta.appendChild(el('span', {cls:'li__side', text:opts.side}));
  var x = el('button', {cls:'li__x', 'aria-label':'삭제'});
  x.appendChild(svgIcon('M6 6l12 12M18 6L6 18'));
  li.appendChild(el('span', {cls:'li__dot ' + opts.dot}));
  li.appendChild(el('div', {cls:'li__main'}, [ meta, el('div', {cls:'li__txt', text:opts.text}) ]));
  li.appendChild(x);
  return li;
}
/* 어떤 장의 주석들이 본문 어느 자리에 달려 있는지 — {주석id: {i:문단, a:그 문단 안 글자 위치}}.
   글자 위치는 fill() 이 그리는 그대로(마커 자리에 짧은 표시 글자가 들어감) 세므로,
   본문 형광펜의 a 오프셋과 같은 잣대로 비교할 수 있습니다. */
function notePosMap(ch){
  var c = CH[ch], map = {};
  if(!c || !c.ko) return map;
  c.ko.forEach(function(text, i){
    var parts = String(text).split(/\{\{([a-z0-9_]+)\}\}/), acc = 0;
    for(var j = 0; j < parts.length; j++){
      if(j % 2 === 0){ acc += parts[j].length; continue; }
      var n = c.notes && c.notes[parts[j]];
      if(!n) continue;
      if(!map[parts[j]]) map[parts[j]] = {i:i, a:acc};
      acc += (n.m || '주').length;
    }
  });
  return map;
}
function buildHlPanel(){
  var list = document.getElementById('hlList'); clear(list);
  var any = false;
  /* 주석 팝업 안에서 칠한 형광펜은 'n:<장>:<주석id>' 키로 따로 저장되어 있으므로 먼저 장별로 모읍니다 */
  var noteKeys = {};
  Object.keys(S.hl).forEach(function(k){
    if(k.indexOf('n:') !== 0 || !S.hl[k] || !S.hl[k].length) return;
    (noteKeys[k.split(':')[1]] || (noteKeys[k.split(':')[1]] = [])).push(k);
  });
  ORDER.forEach(function(ch){
    var arr = S.hl[ch] || [], nks = noteKeys[ch] || [];
    if(!arr.length && !nks.length) return;
    any = true;
    list.appendChild(el('div', {cls:'panel__head', text:chLabel(ch)}));

    /* 본문 형광펜 한 조각, 주석 하나(그 안의 형광펜 묶음)를 모두 '본문 속 위치' 하나로 늘어놓습니다.
       읽으면서 본문과 주석에 번갈아 칠한 순서 그대로 보이게 하기 위해서입니다. */
    var pos = notePosMap(ch), rows = [];
    arr.forEach(function(h){ rows.push({i:h.i, a:h.a, n:0, h:h}); });
    nks.forEach(function(key){
      var noteId = key.split(':').slice(2).join(':');
      var at = pos[noteId] || {i:1e9, a:0};          /* 본문에 자리를 못 찾은 주석은 장 끝에 */
      rows.push({i:at.i, a:at.a, n:1, key:key, noteId:noteId});
    });
    rows.sort(function(x,y){ return (x.i-y.i) || (x.a-y.a) || (x.n-y.n); });

    rows.forEach(function(r){
      if(!r.n){
        var h = r.h;
        list.appendChild(liItem({
          kind:'hl', ch:ch, i:h.i, hlid:h.id, dot:'d-' + h.c,
          meta:CLABEL[h.c] || '', side:(h.side === 'ko' ? '한글' : '영문'), text:h.t
        }));
        return;
      }
      var note = (CH[ch] && CH[ch].notes && CH[ch].notes[r.noteId]) || {};
      list.appendChild(el('div', {cls:'panel__sub', text:'주해 · ' + (note.title || note.m || '주해')}));
      S.hl[r.key].slice().sort(function(x,y){ return (x.i-y.i) || (x.a-y.a); }).forEach(function(h){
        list.appendChild(liItem({
          kind:'hl', ch:r.key, i:h.i, hlid:h.id, note:r.noteId, ownerCh:ch,
          dot:'d-' + h.c, meta:CLABEL[h.c] || '', side:'주해', text:h.t
        }));
      });
    });
  });
  if(!any) emptyPanel(list, 'M4 5h13a2 2 0 0 1 2 2v13l-4-3H4z', '아직 형광펜으로 칠한 곳이 없습니다.\n본문에서 원하는 대목을 그어 선택해 보세요.');
}
/* 형광펜 목록에서 주석 형광펜을 누르면 그 주석을 엽니다 (다른 장이면 그 장으로 먼저 이동) */
function gotoNote(ownerCh, noteId){
  closeDrawerIfMobile();
  if(S.ch === ownerCh){ showNote(noteId); }
  else { S.jumpNote = {ch:ownerCh, note:noteId}; location.hash = ownerCh; }
}
function buildMemoPanel(){
  var list = document.getElementById('memoList'); clear(list);
  var any = false;
  ORDER.forEach(function(ch){
    /* 본문 노트는 그 자리, 주해 노트는 그 주해 표지가 달린 본문 자리로 줄 세웁니다 */
    var pos = notePosMap(ch), rows = [];
    (S.memo[ch] || []).forEach(function(m){ rows.push({i:m.parts[0].i, a:m.parts[0].a, n:0, m:m}); });
    Object.keys(S.memo).forEach(function(k){
      if(k.indexOf('n:' + ch + ':') !== 0) return;
      var at = pos[k.split(':').slice(2).join(':')] || {i:1e9, a:0};
      (S.memo[k] || []).forEach(function(m){ rows.push({i:at.i, a:at.a, n:1 + m.parts[0].i / 1e3, m:m, key:k}); });
    });
    if(!rows.length) return;
    any = true;
    list.appendChild(el('div', {cls:'panel__head', text:chLabel(ch)}));
    rows.sort(function(x, y){ return (x.i - y.i) || (x.a - y.a) || (x.n - y.n); }).forEach(function(r){
      var m = r.m, q = m.t.length > 30 ? m.t.slice(0, 30) + '…' : m.t;
      list.appendChild(liItem({kind:'memo', ch:ch, i:m.parts[0].i, memo:m.id, dot:'d-memo',
        meta:(r.key ? memoTitle(r.key) + ' · ' : '') + '“' + q + '”', text:m.body}));
    });
  });
  if(!any) emptyPanel(list, 'M5 4h10l4 4v12H5zM15 4v4h4M8 12h8M8 16h5', '아직 노트가 없습니다.\n본문을 그어 선택한 뒤 ‘노트’를 누르면\n그 대목에 생각을 적어 둘 수 있습니다.');
}
function buildBmPanel(){
  var list = document.getElementById('bmList'); clear(list);
  if(!S.bm.length){
    emptyPanel(list, 'M6 3h12v18l-6-4-6 4z', '아직 북마크가 없습니다.\n읽던 자리에서 상단의 리본 아이콘을 누르면\n이 자리가 저장됩니다.');
    return;
  }
  S.bm.slice().sort(function(x,y){
    var dx = ORDER.indexOf(x.ch) - ORDER.indexOf(y.ch);
    return dx || (x.i - y.i);
  }).forEach(function(b){
    list.appendChild(liItem({ kind:'bm', ch:b.ch, i:b.i, dot:'d-bm', meta:chLabel(b.ch), text:b.t }));
  });
}
function updCounts(){
  var hc = 0; for(var k in S.hl){ hc += (S.hl[k] ? S.hl[k].length : 0); }
  var e1 = document.getElementById('cntHl'), e2 = document.getElementById('cntBm'), e3 = document.getElementById('cntMemo');
  var mc = 0; for(var k2 in S.memo){ mc += (S.memo[k2] ? S.memo[k2].length : 0); }
  if(e1) e1.textContent = hc ? '·' + hc : '';
  if(e3) e3.textContent = mc ? '·' + mc : '';
  if(e2) e2.textContent = S.bm.length ? '·' + S.bm.length : '';
}
function switchTab(name){
  S.tab = name;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.classList.toggle('on', b.dataset.tab === name); });
  ['toc','hl','memo','bm'].forEach(function(p){
    document.querySelector('.panel[data-panel="' + p + '"]').hidden = (p !== name);
  });
  if(name === 'hl') buildHlPanel();
  if(name === 'bm') buildBmPanel();
  if(name === 'memo') buildMemoPanel();
}

/* ── 이동 ─────────────────────────────────────────────── */
/* hlid가 있으면 문단 첫머리가 아니라 그 형광펜 자리로 갑니다 (긴 문단에서는 한참 아래에 있을 수 있어서) */
function scrollToPara(i, flash, hlid){
  var box = document.querySelector('.para[data-i="' + i + '"]'); if(!box) return;
  var spans = hlid ? box.querySelectorAll('.hl[data-hl="' + hlid + '"]') : [];
  var target = spans.length ? spans[0] : box;
  var barEl = document.querySelector('.bar');
  var y = window.scrollY + target.getBoundingClientRect().top - (barEl ? barEl.offsetHeight : 0) - (spans.length ? 72 : 12);
  window.scrollTo(0, Math.max(0, y));
  if(!flash) return;
  if(spans.length){
    Array.prototype.forEach.call(spans, function(sp){ sp.classList.add('hlflash'); });
    setTimeout(function(){ Array.prototype.forEach.call(spans, function(sp){ sp.classList.remove('hlflash'); }); }, 1500);
  } else { box.classList.add('flash'); setTimeout(function(){ box.classList.remove('flash'); }, 1500); }
}
function gotoPara(ch, i, flash, hlid){
  closeSheet();                 /* 열려 있던 주석 팝업을 닫고 본문으로 이동합니다 */
  closeDrawerIfMobile();
  if(S.ch === ch){ scrollToPara(i, flash, hlid); }
  else { S.jump = {ch:ch, i:i, flash:flash, hl:hlid}; location.hash = ch; }
}

/* ── 시트 ─────────────────────────────────────────────── */
function openSheet(kind, title, kindKey){
  flushMemo();                       /* 열려 있던 노트는 저장하고 넘어갑니다 */
  S.noteId = null; S.noteCh = null;  /* showNote 가 아닌 다른 시트라면 주석 컨텍스트는 없습니다 */
  var k = document.getElementById('sheetKind');
  k.textContent = kind;
  var blue = kindKey === 's' || kindKey === 'm';   /* 성경 주석과 노트는 링크 파랑 */
  k.style.background = blue ? 'var(--link-wash)' : 'var(--indigo-wash)';
  k.style.color = blue ? 'var(--link)' : 'var(--ink-soft)';
  document.getElementById('sheetTtl').textContent = title;
  var body = document.getElementById('sheetBody');
  clear(body);
  document.getElementById('sheet').classList.add('on');
  if(window.innerWidth < 1024) document.getElementById('scrim').classList.add('on');
  return body;
}
function closeSheet(){
  flushMemo(true);
  document.getElementById('sheet').classList.remove('on');
  if(window.innerWidth < 1024) document.getElementById('scrim').classList.remove('on');
}

function showNote(id){
  var n = (CH[S.ch].notes || {})[id]; if(!n) return;
  var k = KIND[n.k] || KIND.t;
  var ownerCh = S.ch;
  /* 성경 주석은 머리 배지에 '성경' 대신 장·절 약칭(골 1:27)을 띄워 무슨 구절인지 바로 보이게 합니다 */
  var body = openSheet((n.k === 's' && n.m) ? n.m : k.label, n.title || n.m || '주', n.k);
  S.noteId = id; S.noteCh = ownerCh;

  /* 원문 인용·한글 사역·해설처럼 '내용'에 해당하는 문단에만 형광펜을 그을 수 있도록,
     순서대로 번호(data-nb)를 매겨 둡니다. 출처 표기·링크는 캡션이라 대상에서 뺍니다. */
  var nb = 0;
  function blk(tag, cls, text){
    var attrs = {'data-nb': String(nb++)};
    attrs.cls = cls ? cls + ' nblk' : 'nblk';
    attrs.text = text;
    return el(tag, attrs);
  }
  if(n.o) body.appendChild(blk('p', 'origq', n.o));
  if(n.q){
    var qwrap = el('div', {cls:'quote'});
    qwrap.appendChild(blk('p', 'k', n.q));
    if(n.qe) qwrap.appendChild(blk('p', 'e', n.qe));
    if(n.m) qwrap.appendChild(el('p', {cls:'qref', text:'— ' + fullRef(n.m)}));
    body.appendChild(qwrap);
    body.appendChild(el('p', {cls:'qsrc', text:'한글 본문 · 옮긴이 사역 (정확한 본문은 아래 새한글성경 링크) | 영문 · KJV 1611' }));
  }
  if(n.t) n.t.split('\n').forEach(function(line){ if(line.trim()) body.appendChild(blk('p', null, line)); });
  applyNoteMemos(ownerCh, id, body);
  applyNoteHls(ownerCh, id, body);
  if(n.ref){
    var q = encodeURIComponent(n.ref);
    var links = el('div', {cls:'sheet__links'});
    /* 새한글성경(대한성서공회) 온라인 리더 — ?chapter=책.장&verse=책.장.절 로 그 절이 표시된 채 열립니다 */
    if(n.usfm) links.appendChild(el('a', {
      target:'_blank', rel:'noopener',
      href:'https://bskorea.or.kr/KNT/?chapter=' + n.usfm.split('.').slice(0, 2).join('.') + '&verse=' + n.usfm,
      text:'새한글성경 본문'
    }));
    [['개역·쉬운성경','KOERV'], ['English · ESV','ESV'], ['KJV · 베이츠 당대','KJV']].forEach(function(v){
      links.appendChild(el('a', {
        target:'_blank', rel:'noopener',
        href:'https://www.biblegateway.com/passage/?search=' + q + '&version=' + v[1],
        text:v[0]
      }));
    });
    body.appendChild(links);

function buildSyncBox(){

  mk.onclick = function(){
    if(kIn.value.trim() && !confirm('이미 코드가 있습니다. 새로 만들면 다른 기기와 연결이 끊어집니다.\n\n두 번째 기기라면 새로 만들지 말고, 첫 기기의 코드를 그대로 입력하세요.\n\n그래도 새로 만들까요?')) return;
    kIn.value = SYNC.pretty(SYNC.randomCode());
  };

  sv.onclick = function(){
    var k = SYNC.normalize(kIn.value);
    if(k.length < 16){ toast('코드가 짧아요 · 16자리를 정확히 입력해 주세요'); return; }
    SYNC.save(SYNC.defaultUrl(), k);

    SYNC.run(false);
  };

  var cp = el('button', {cls:'bkbtn', text:'코드 복사'});
  cp.onclick = function(){
    var k = SYNC.normalize(kIn.value);

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(pk).then(function(){ toast('코드를 복사했어요'); },
        function(){ prompt('이 코드를 다른 기기에 입력하세요', pk); });

    SYNC.save(null, null); kIn.value = '';

  };

  box.appendChild(kIn);
  box.appendChild(el('div', {cls:'bkrow'}, [mk, cp]));
  box.appendChild(el('div', {cls:'bkrow'}, [sv]));
  box.appendChild(el('div', {cls:'bkrow'}, [off]));
  box.appendChild(el('p', {cls:'syncstat', id:'syncMsg', text: SYNC.on() ? SYNC.lastText() : '꺼짐 — 이 기기는 아직 동기화되지 않습니다'}));
  box.appendChild(el('p', {cls:'bkhint', text:'첫 기기에서 ①로 코드를 만들고 ②를 누르세요. 두 번째 기기에서는 코드를 만들지 말고, 같은 코드를 그대로 입력한 뒤 ②만 누르면 됩니다.'}));
  box.appendChild(el('p', {cls:'bkhint', text:'아이폰·아이패드는 홈 화면에 추가한 앱과 사파리의 저장 공간이 서로 분리되어 있습니다. 그래서 홈 화면 앱에서도 코드를 한 번 입력해 주셔야 합니다.'}));
  return box;
}

/* 글자 크기: 16~40px 슬라이더와 한 단계씩 버튼 */
var FS_MIN = 16, FS_MAX = 40;
function fsControl(){
  var rng = el('input', {type:'range', cls:'fsrange', min:String(FS_MIN), max:String(FS_MAX), step:'1', 'aria-label':'글자 크기'});
  rng.value = S.fs;
  var val = el('span', {cls:'fsval', text:S.fs + 'px'});
  function setFs(v){
    v = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(v)));
    rng.value = v; val.textContent = v + 'px'; set('fs', v);
  }
  var minus = el('button', {cls:'fsbtn', text:'가−', 'aria-label':'글자 작게'});
  var plus = el('button', {cls:'fsbtn', text:'가+', 'aria-label':'글자 크게'});
  minus.onclick = function(){ setFs(S.fs - 1); };
  plus.onclick = function(){ setFs(S.fs + 1); };
  rng.addEventListener('input', function(){ setFs(+rng.value); });
  return el('div', {cls:'fsrow'}, [minus, rng, plus, val]);
}
function row(label, inner){
  return el('div', {cls:'set__row'}, [el('div', {cls:'set__lab', text:label}), inner]);
}
function seg(key, opts, cur){
  var s = el('div', {cls:'seg', 'data-seg':key});
  opts.forEach(function(o){
    s.appendChild(el('button', {cls:String(o[0]) === String(cur) ? 'on' : '', 'data-v':o[0], text:o[1]}));
  });

}
function isWide(){ return window.innerWidth >= 1024; }
function navIsOpen(){ return document.getElementById('drawer').classList.contains('on'); }
/* 지금 화면 위쪽에 걸쳐 있는 첫 문단 (스크롤 기준점) */
function topAnchorPara(){
  var barEl = document.querySelector('.bar');
  var top = (barEl ? barEl.offsetHeight : 0) + 14;
  var boxes = document.querySelectorAll('.para[data-i]');
  for(var j = 0; j < boxes.length; j++){
    if(boxes[j].getBoundingClientRect().bottom > top) return boxes[j];
  }
  return null;
}
function setNav(open){
  /* 넓은 화면에서는 본문이 유동 폭이라, 사이드바를 여닫으면 본문 폭이 바뀌며 글이
     다시 줄바꿈됩니다(리플로우). iOS 사파리는 이때 스크롤 위치를 지켜 주는 기능
     (overflow-anchor)이 없어 엉뚱한 곳(주로 맨 아래)으로 튑니다. 그래서 읽던 문단을
     애니메이션 내내 같은 자리에 붙들어 둡니다. */
  var wide = isWide();
  var changing = open !== navIsOpen();
  var anchor = null;
  if(wide && changing && S.ch && S.ch !== 'cover'){
    var box = topAnchorPara();
    if(box) anchor = { i: +box.dataset.i, off: box.getBoundingClientRect().top };
  }

  document.getElementById('drawer').classList.toggle('on', open);
  document.getElementById('btnToc').classList.toggle('on', open);
  var scr = document.getElementById('scrim');
  if(wide){
    document.body.classList.toggle('navpad', open);
    scr.classList.remove('on');
    LS.set('hb.nav', open ? '1' : '0');
  } else {
    document.body.classList.remove('navpad');
    scr.classList.toggle('on', open);
  }

  if(anchor){
    var pin = function(){
      var b = document.querySelector('.para[data-i="' + anchor.i + '"]');
      if(!b) return;
      var d = b.getBoundingClientRect().top - anchor.off;
      if(Math.abs(d) > 0.5) window.scrollBy(0, d);
    };
    /* 애니메이션 동안 매끄럽게 붙들되(rAF), 최종 위치는 setTimeout 으로 반드시 보정합니다.
       (rAF 는 탭이 안 보이면 멈추므로, 착지 위치 보장은 setTimeout 이 맡습니다) */
    var t0 = Date.now();
    (function loop(){
      pin();
      if(Date.now() - t0 < 380) requestAnimationFrame(loop);
    })();
    setTimeout(pin, 200);
    setTimeout(pin, 360);   /* 전환(0.3s)이 끝난 뒤 최종 확정 */
  }
}
/* 넓은 화면에서는 사이드바를 유지하고, 좁은 화면에서만 자동으로 닫습니다 */

function buildReadbar(){
  var seg = document.getElementById('readSeg'); clear(seg);
  ORDER.slice(1).forEach(function(cid){
    var s = el('div', {cls:'pseg', 'data-ch':cid, title:(CH[cid].roman ? CH[cid].roman.replace('.','') + '. ' : '') + (CH[cid].title_ko || CH[cid].title)});
    s.appendChild(el('div', {cls:'pseg__fill'}));
    seg.appendChild(s);
  });
}
function updReadbar(frac){
  var readable = ORDER.slice(1), segs = document.getElementById('readSeg').children, sum = 0;
  for(var i = 0; i < readable.length; i++){
    var cid = readable[i], f = 0;
    if(S.read[cid]) f = 1;
    else if(cid === S.ch) f = frac || 0;
    sum += f;
    var segEl = segs[i]; if(!segEl) continue;
    segEl.classList.toggle('cur', cid === S.ch);
    segEl.firstChild.style.width = (f * 100) + '%';
  }
  document.getElementById('readPct').textContent = '전체 ' + Math.round(sum / readable.length * 100) + '%';
}
function updProgress(){
  var h = document.documentElement;
  /* document.documentElement.scrollTop 은 iOS 홈 화면 앱 등에서 0을 반환할 수 있어,
     신뢰할 수 있는 window.scrollY / innerHeight 를 씁니다. */
  var top = window.scrollY || window.pageYOffset || h.scrollTop || document.body.scrollTop || 0;
  var docH = Math.max(h.scrollHeight, document.body.scrollHeight);
  var max = docH - window.innerHeight;
  var frac = (S.ch && S.ch !== 'cover' && max > 40) ? Math.min(1, top / max) : 0;
  updReadbar(frac);
  updBmBtn();
  if(frac > 0.88 && S.ch && S.ch !== 'cover' && !S.read[S.ch]){
    S.read[S.ch] = 1;
    if(window.SYNC) SYNC.schedule();
    LS.set('hb.read', JSON.stringify(S.read));
    buildToc();
  }
}

document.addEventListener('click', function(e){
  var sg = e.target.closest('.pseg[data-ch]');

  var tab = e.target.closest('.tab');
  if(tab){ switchTab(tab.dataset.tab); return; }

  var x = e.target.closest('.li__x');

    e.stopPropagation();
    var li = x.closest('.li');

      buildHlPanel();
    } else if(li.dataset.kind === 'memo'){
      if(!confirm('이 노트를 지울까요?')) return;
      removeMemoEntry(li.dataset.memoid);
      refreshMemoView(li.dataset.ch);
      buildMemoPanel();
    } else {
      removeBm(li.dataset.ch, +li.dataset.i);
      buildBmPanel();
    }
    return;
  }
  var li2 = e.target.closest('.li');
  if(li2){
    if(li2.dataset.kind === 'memo'){ gotoMemo(li2.dataset.ch, li2.dataset.memoid); }
    else if(li2.dataset.note){ gotoNote(li2.dataset.ownerch, li2.dataset.note); }

    return;

  var m = e.target.closest('.mark[data-note]');
  if(m){ e.stopPropagation(); showNote(m.dataset.note); return; }

  var hl = e.target.closest('.hl[data-hl]');

    var mo = findMemo(mm.dataset.memo); if(mo) openMemoSheet(mo, false);

  var sg = e.target.closest('.seg button');
  if(sg){

    Array.prototype.forEach.call(sg.parentNode.children, function(b){ b.classList.remove('on'); });
    sg.classList.add('on'); set(key, sg.dataset.v); return;

  if(e.target.closest('.toc a, .navfeet a, .startbtn')) closeDrawerIfMobile();
});

/* 화면 폭이 경계를 넘나들 때 사이드바 상태를 다시 맞춥니다 (아이패드 회전 등) */
var wasWide = isWide();
window.addEventListener('resize', function(){
  var w = isWide();
  if(w !== wasWide){
    wasWide = w;
    setNav(w ? (LS.get('hb.nav') === '1') : false);
  }
}, {passive:true});

/* 시작 */
apply();
buildReadbar();
switchTab('toc');
setNav(isWide() ? (LS.get('hb.nav') === '1') : false);
if(!location.hash){
  var at = LS.get('hb.at');
  if(at && CH[at] && at !== 'cover') location.hash = at;
}
/* 짝짓기 링크(#sync=...)로 들어왔으면 설정부터 받아들입니다 */
var adopted = SYNC.adoptFromHash();
route(true);
if(adopted) toast('이 기기를 연결했어요 · 기록을 맞추는 중…');

/* 앱을 열 때, 다시 화면에 돌아올 때, 인터넷이 붙을 때 맞춥니다 (내용이 같으면 쓰기는 생략됩니다) */
if(SYNC.on()) SYNC.run(true);
document.addEventListener('visibilitychange', function(){
  if(document.hidden) flushBeacon();            /* 백그라운드로 갈 때 마지막으로 올림 */
  else if(SYNC.on()) SYNC.run(true);            /* 돌아올 때 내려받아 맞춤 */
});
window.addEventListener('online', function(){ if(SYNC.on()) SYNC.run(true); });
window.addEventListener('pagehide', flushBeacon);
/* 바뀐 게 있을 때만 sendBeacon(POST·text/plain — 프리플라이트 없이)으로 마지막 flush.
   내용이 그대로면 보내지 않아 하루 쓰기 한도를 아낍니다. */
function flushBeacon(){
  if(!SYNC.on() || !navigator.sendBeacon || !SYNC.dirty()) return;
  try{
    var c = SYNC.config();
    navigator.sendBeacon(c.u.replace(/\/+$/, '') + '/d/' + encodeURIComponent(c.k),
      new Blob([JSON.stringify(snapshot())], {type:'text/plain;charset=UTF-8'}));
  }catch(e){}
}

/* 저장소가 막힌 환경(사파리 프라이빗 등)이면 조용히 날아가지 않도록 알려 줍니다 */
if(!LS.ok){
  var warn = el('div', {cls:'stwarn'}, [
    el('b', {text:'이 화면에서는 기록이 저장되지 않습니다. '}),
    txt('북마크·형광펜·읽은 위치가 창을 닫으면 사라집니다. 사파리로 이 주소를 열고 ‘홈 화면에 추가’해서 사용하시면 기록이 유지됩니다.')
  ]);
  document.body.appendChild(warn);
}
</script>
